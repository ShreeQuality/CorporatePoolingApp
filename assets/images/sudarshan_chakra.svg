<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<style>
.rot_slow{transform-box:fill-box;transform-origin:center;animation:spinSlow 18s linear infinite}
.rot_medium{transform-box:fill-box;transform-origin:center;animation:spinMedium 10s linear infinite}
.rot_fast{transform-box:fill-box;transform-origin:center;animation:spinFast 5s linear infinite}
@keyframes spinSlow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinMedium{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinFast{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.middle_rotate{transform-box:fill-box;transform-origin:center;animation:spinMiddle 12s linear infinite}
@keyframes spinMiddle{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}


.inner_ashoka_move{
  transform-box:fill-box;
  transform-origin:center;
  animation:innerAshokaSpin 3.8s linear infinite;
}
.inner_ring_move{
  transform-box:fill-box;
  transform-origin:center;
  animation:innerRingSpin 7s linear infinite;
}
.inner_detail_move{
  transform-box:fill-box;
  transform-origin:center;
  animation:innerDetailSpin 5.5s linear infinite;
}
@keyframes innerAshokaSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes innerRingSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes innerDetailSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

.hexagon_fire {
  transform-box: fill-box;
  transform-origin: center;
  animation: hexagonFireSpin 5.8s linear infinite;
}
@keyframes hexagonFireSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
<defs>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="core">
    <stop offset="0" stop-color="#fff6a0"/>
    <stop offset=".35" stop-color="#ffd33d"/>
    <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
  </radialGradient>
</defs>

