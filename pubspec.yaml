name: corporate_pooling_app
description: "Corporate Pooling App - Ride Sharing & Pooling for Corporate Employees and Public Users"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase & Networking
  supabase_flutter: ^2.5.0
  http: ^1.2.0
  
  # State Management & Storage
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  
  # Maps & Location
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  
  # UI & Design
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0
  
  # Utilities & Hardware
  image_picker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
