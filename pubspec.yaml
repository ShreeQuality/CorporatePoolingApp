name: corporate_pooling_app
description: "Corporate Pooling App - Ride Sharing & Pooling for Corporate Employees and Public Users"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase & Networking
  supabase_flutter: ^2.8.0
  http: ^1.2.1
  
  # State Management & Secure Storage
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # Biometrics & Hardware
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  
  # Push Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  intl: ^0.19.0
  sms_autofill: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
